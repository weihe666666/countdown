<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Countdown</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }
  body.flash {
    animation: flashBg 0.3s alternate infinite;
  }
  @keyframes flashBg {
    from { background: #0f1115; }
    to { background: #ef4444; }
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .digits {
    display: flex;
    gap: 3vw;
    align-items: center;
    flex-wrap: wrap;
  }
  .block {
    background: #171a21;
    border: 2px solid #2c3345;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    padding: 1vw 3vw;
    min-width: 30vw;
  }
  .value {
    font-size: clamp(60px, 20vw, 200px);
    font-weight: bold;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: clamp(14px, 2vw, 20px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-top: 0.5vw;
  }
  .controls {
    margin-top: 2vw;
    display: flex;
    gap: 1vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    all: unset;
    cursor: pointer;
    background: #22c55e;
    color: #0f1115;
    font-weight: bold;
    padding: 1vw 2vw;
    border-radius: 12px;
    font-size: clamp(16px, 3vw, 26px);
    transition: transform 0.1s ease, background 0.3s ease;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.97); }
  button.reset { background: #ef4444; color: #fff; }
  button.pause { background: #3b82f6; color: #fff; }
  input {
    font-size: clamp(18px, 3vw, 30px);
    text-align: center;
    border-radius: 8px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    width: 80px;
    margin: 0 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="digits">
      <div class="block">
        <div id="mm" class="value">02</div>
        <div class="label">MIN</div>
      </div>
      <div class="block">
        <div id="ss" class="value">00</div>
        <div class="label">SEC</div>
      </div>
    </div>
    <div class="controls">
      <input id="minInput" type="number" min="0" max="59" value="2">:
      <input id="secInput" type="number" min="0" max="59" value="0">
      <button id="startBtn">Start</button>
      <button class="pause" id="pauseBtn">Pause</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <audio id="beep">
    <source src="data:audio/wav;base64,UklGRmQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABYAZGF0YUQAAAAA/////wAAAP///wAAAP///wAAAP7+/v7+/v7+/v7+/v///wAAAP///wAAAP///wAAAP///wAAAP///wAAAP7+/v7+/v7+/v7+////AAD///8AAP///wAAAP///wAA" type="audio/wav">
  </audio>

<script>
const mm = document.getElementById('mm');
const ss = document.getElementById('ss');
const minInput = document.getElementById('minInput');
const secInput = document.getElementById('secInput');
const beep = document.getElementById('beep');
const body = document.body;

let timer = null;
let left = 0;
let endTime = 0;
let running = false;
let paused = false;
let flashing = false;

function pad(n){ return String(n).padStart(2,'0'); }
function updateDisplay(){
  const m = Math.floor(left / 60);
  const s = left % 60;
  mm.textContent = pad(m);
  ss.textContent = pad(s);
  document.title = left>0 ? `${pad(m)}:${pad(s)} ⏳` : "Countdown";
}
function start(){
  stopFlash();
  if (running && !paused) return;
  if (!running){
    const m = parseInt(minInput.value)||0;
    const s = parseInt(secInput.value)||0;
    left = m*60 + s;
  }
  if (left<=0) return;
  running = true;
  paused = false;
  endTime = Date.now() + left*1000;
  tick();
  timer = setInterval(tick, 200);
}
function tick(){
  left = Math.max(0, Math.round((endTime - Date.now())/1000));
  updateDisplay();
  if (left<=0){
    clearInterval(timer);
    running = false;
    paused = false;
    try{ beep.play(); }catch(e){}
    startFlash();
  }
}
function pause(){
  stopFlash();
  if (!running) return;
  if (!paused){
    paused = true;
    clearInterval(timer);
    left = Math.max(0, Math.round((endTime - Date.now())/1000));
  } else {
    paused = false;
    endTime = Date.now() + left*1000;
    clearInterval(timer);
    timer = setInterval(tick, 200);
  }
}
function reset(){
  stopFlash();
  clearInterval(timer);
  running = false;
  paused = false;
  const m = parseInt(minInput.value)||0;
  const s = parseInt(secInput.value)||0;
  left = m*60 + s;
  updateDisplay();
}
function startFlash(){
  if (!flashing){
    body.classList.add('flash');
    flashing = true;
  }
}
function stopFlash(){
  if (flashing){
    body.classList.remove('flash');
    flashing = false;
  }
}
document.getElementById('startBtn').onclick=start;
document.getElementById('pauseBtn').onclick=pause;
document.getElementById('resetBtn').onclick=reset;
updateDisplay();
</script>
</body>
</html>
